[project]
name = "rtosaurus"
version = "0.1.0"
description = "An emulated 16-bit MCU running a preemptive RTOS in its own assembly, PID-controlling a simulated thermal plant, with fault injection."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rtosaurus"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
